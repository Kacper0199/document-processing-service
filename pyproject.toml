[project]
name = "papertrail"
version = "0.1.0"
description = "Asynchronous document processing service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.22,<1",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
