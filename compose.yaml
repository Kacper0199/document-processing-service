services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PAPERTRAIL_MINERU_BASE_URL: ${PAPERTRAIL_MINERU_BASE_URL:-http://host.docker.internal:8000}
      PAPERTRAIL_OLLAMA_BASE_URL: ${PAPERTRAIL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PAPERTRAIL_OLLAMA_MODEL: ${PAPERTRAIL_OLLAMA_MODEL:-llama3.1:8b}
    volumes:
      - papertrail-work:/app/.papertrail-data

volumes:
  papertrail-work:
